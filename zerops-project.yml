services:
  # 1. Next.js Web Frontend & REST API
  - hostname: web
    type: nodejs@22
    verticalAutoscaling:
      minCpu: 1
      maxCpu: 4
      minRam: 1
      maxRam: 8

  # 2. Crawler & LLM Background Processing Worker
  - hostname: worker
    type: nodejs@22
    verticalAutoscaling:
      minCpu: 2
      maxCpu: 6
      minRam: 2
      maxRam: 12

  # 3. PostgreSQL Database
  - hostname: db
    type: postgresql:single@16
    profile: oltp-staging
    verticalAutoscaling:
      minCpu: 1
      maxCpu: 4
      minRam: 1
      maxRam: 8

  # 4. Valkey / Redis Queue for BullMQ
  - hostname: redis
    type: valkey:single@7.2
    verticalAutoscaling:
      minCpu: 1
      maxCpu: 2
      minRam: 0.5
      maxRam: 4
